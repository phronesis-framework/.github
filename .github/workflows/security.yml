# Reusable security workflow: CodeQL (Python), pip-audit, gitleaks.
#
# TODO(pin-by-sha): replace tag pins below with commit-SHA pins.

name: security

on:
  workflow_call:
    inputs:
      extras:
        type: string
        required: false
        default: "all"
    secrets:
      GITLEAKS_LICENSE:
        required: false

permissions:
  contents: read

jobs:
  codeql:
    name: codeql (python)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4  # TODO(pin-by-sha)
      - uses: github/codeql-action/init@v3  # TODO(pin-by-sha)
        with:
          languages: python
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3  # TODO(pin-by-sha)
        with:
          category: "/language:python"

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4  # TODO(pin-by-sha)
      - uses: astral-sh/setup-uv@v3  # TODO(pin-by-sha)
        with:
          enable-cache: true
      - uses: actions/setup-python@v5  # TODO(pin-by-sha)
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --extra ${{ inputs.extras }}
      - name: pip-audit
        run: uv run --with pip-audit pip-audit --strict

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4  # TODO(pin-by-sha)
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2  # TODO(pin-by-sha)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
